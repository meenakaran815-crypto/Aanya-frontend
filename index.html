<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#08080c">
<title>Aanya ❤️ Video Call</title>

<style>
*{box-sizing:border-box}

html,body{
 margin:0;
 width:100%;
 height:100%;
 overflow:hidden;
 background:#08080c;
 color:#fff;
 font-family:system-ui,-apple-system,sans-serif
}

.call{
 position:relative;

 background:radial-gradient(circle at 50% 30%,#3a3040,#111018 55%,#07070a)
}

#remote{

 inset:0;
 width:100%;
 height:100%;

}

.avatar{

 place-items:center;

}

.face{
 width:155px;
 height:155px;
 border-radius:50%;
 display:grid;
 place-items:center;
 background:#7040b5;
 font-size:72px;
 box-shadow:0 18px 55px #0009
}

.avatar h2{
 margin:18px 0 3px;
 font-size:25px
}

.avatar p{
 margin:0;
 color:#c8c4cf
}

.top{
 position:absolute;
 z-index:5;
 top:0;
 left:0;
 right:0;
 padding:18px 15px;
 display:flex;
 justify-content:space-between;
 align-items:center;
 background:linear-gradient(#000b,transparent)
}

.name{
 font-size:19px;
 font-weight:700
}

.online{
 font-size:12px;
 color:#a6f2c0;
 margin-top:2px
}

.actions{
 display:flex;
 gap:8px
}

button{
 border:0;
 color:#fff;
 cursor:pointer
}

.round{
 width:42px;
 height:42px;
 border-radius:50%;
 background:#15151bcc;
 font-size:19px
}

.self{
 position:absolute;
 z-index:6;
 right:14px;
 top:80px;
 width:105px;
 height:145px;
 border-radius:15px;
 overflow:hidden;
 background:#25242b;
 border:1px solid #ffffff55;
 box-shadow:0 8px 28px #0009
}

#local{
 width:100%;
 height:100%;
 object-fit:cover;
 transform:scaleX(-1)
}

.self span{
 position:absolute;
 bottom:7px;
 left:7px;
 background:#0009;
 padding:3px 7px;
 border-radius:8px;
 font-size:11px
}

.status{
 position:absolute;
 z-index:5;
 left:0;
 right:0;
 bottom:122px;
 text-align:center;
 font-size:13px;
 text-shadow:0 1px 6px #000
}

.chat{
 position:absolute;
 z-index:5;
 left:13px;
 right:13px;
 bottom:170px;
 max-height:30vh;
 overflow:hidden;
 pointer-events:none
}

.b{
 display:table;
 max-width:80%;
 padding:8px 11px;
 margin:5px 0;
 border-radius:15px;
 background:#000a;
 font-size:13px;
 line-height:1.35
}

.b.me{
 margin-left:auto;
 background:#7040b5
}

.controls{
 position:absolute;
 z-index:7;
 left:0;
 right:0;
 bottom:0;
 padding:20px 15px calc(18px + env(safe-area-inset-bottom));
 display:flex;
 justify-content:center;
 gap:11px;
 background:linear-gradient(transparent,#000d)
}

.control{
 width:55px;
 height:55px;
 border-radius:50%;
 background:#292932e8;
 font-size:22px
}

.end{
 width:64px;
 height:64px;
 background:#ed3442;
 font-size:26px
}

.toast{
 position:absolute;
 z-index:10;
 top:50%;
 left:50%;
 transform:translate(-50%,-50%);
 background:#000d;
 padding:12px 18px;
 border-radius:20px;
 display:none;
 font-size:13px
}

.speaking{
 animation:pulse .8s infinite alternate
}

@keyframes pulse{
 from{box-shadow:0 0 0 0 #7040b566}
 to{box-shadow:0 0 0 17px #7040b500}
}
</style>
</head>

<body>

<div class="call">

<video id="remote" autoplay playsinline></video>

<div class="avatar" id="avatar">
 <div>
  <div class="face">A</div>
  <h2>Aanya ❤️</h2>
  <p>Voice video call</p>
 </div>
</div>

<div class="top">
 <div>
  <div class="name">Aanya ❤️</div>
  <div class="online">● Online</div>
 </div>

 <div class="actions">
  <button class="round" id="switch">↻</button>
  <button class="round" id="more">⋮</button>
 </div>
</div>

<div class="self">
 <video id="local" autoplay muted playsinline></video>
 <span>You</span>
</div>

<div class="status" id="status">
 🎙️ Voice button dabakar Aanya se baat karo
</div>

<div class="chat" id="chat">
 <div class="b">
  Hii 👋 Main Aanya hoon. Bolo na ❤️
 </div>
</div>

<div class="toast" id="toast"></div>

<div class="controls">

 <button class="control" id="cam">📷</button>

 <button class="control" id="mic">🎙️</button>

 <button class="control end" id="end">☎</button>

 <button class="control" id="talk">🗣️</button>

 <button class="control" id="speaker">🔊</button>

</div>

</div>


<script>

/* Aanya Backend */
const API="https://aanya-backend-2.onrender.com/chat";

const local=document.getElementById("local");
const avatar=document.getElementById("avatar");
const statusEl=document.getElementById("status");
const chat=document.getElementById("chat");
const toast=document.getElementById("toast");
const talk=document.getElementById("talk");

let stream=null;
let facing="user";
let micOn=true;
let camOn=true;
let listening=false;
let recognition=null;


/* Toast */
function toastMsg(text){

 toast.textContent=text;
 toast.style.display="block";

 clearTimeout(toastMsg.timer);

 toastMsg.timer=setTimeout(()=>{
  toast.style.display="none";
 },1800);
}


/* Chat Bubble */
function bubble(text,me=false){

 const b=document.createElement("div");

 b.className="b"+(me?" me":"");

 b.textContent=text;

 chat.appendChild(b);

 while(chat.children.length>5){
  chat.removeChild(chat.firstChild);
 }
}


/* Aanya Voice */
function speak(text){

 if(!("speechSynthesis" in window)){
  toastMsg("Phone browser voice support nahi karta");
  return;
 }

 speechSynthesis.cancel();

 const u=new SpeechSynthesisUtterance(text);

 u.lang="hi-IN";
 u.rate=.96;
 u.pitch=1.05;
 u.volume=1;

 u.onstart=()=>{

  talk.classList.add("speaking");

  statusEl.textContent=
  "Aanya bol rahi hai… 🔊";

 };

 u.onend=()=>{

  talk.classList.remove("speaking");

  statusEl.textContent=
  "Aanya sun rahi hai 👂";

 };

 speechSynthesis.speak(u);
}


/* Gemini ko message bhejna */
async function askAanya(text){

 bubble(text,true);

 statusEl.textContent=
 "Aanya soch rahi hai…";

 try{

  const response=await fetch(API,{

   method:"POST",

   headers:{
    "Content-Type":"application/json"
   },

   body:JSON.stringify({
    message:text
   })

  });

  if(!response.ok){
   throw new Error("HTTP "+response.status);
  }

  const data=await response.json();

  const reply=
   data.reply ||
   data.response ||
   data.message ||
   data.text;

  if(!reply){
   throw new Error("No reply");
  }

  bubble(reply);

  speak(reply);

 }
 catch(error){

  console.error(error);

  statusEl.textContent=
  "Backend se reply nahi mila";

  toastMsg(
   "Gemini/Render backend check karo"
  );

 }
}


/* Voice Recognition */
function initRecognition(){

 const SpeechRecognition=
  window.SpeechRecognition ||
  window.webkitSpeechRecognition;

 if(!SpeechRecognition){

  toastMsg(
   "Chrome me voice input try karo"
  );

  return null;
 }

 const r=new SpeechRecognition();

 r.lang="hi-IN";

 r.interimResults=false;

 r.continuous=false;


 r.onstart=()=>{

  listening=true;

  talk.textContent="⏺️";

  statusEl.textContent=
   "Main sun rahi hoon… bolo 👂";

 };


 r.onresult=(event)=>{

  const text=
   event.results[0][0].transcript.trim();
