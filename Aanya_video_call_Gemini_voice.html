<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#08080c"><title>Aanya ❤️ Video Call</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#08080c;color:#fff;font-family:system-ui,-apple-system,sans-serif}.call{position:relative;width:100%;height:100dvh;overflow:hidden;background:radial-gradient(circle at 50% 30%,#403747,#111018 55%,#07070a)}.avatar{position:absolute;inset:0;display:grid;place-items:center;text-align:center;background:radial-gradient(circle at 50% 35%,#403747,#15131b 50%,#07070a)}.face{width:155px;height:155px;border-radius:50%;display:grid;place-items:center;background:#7040b5;font-size:72px;box-shadow:0 18px 55px #0009}.avatar h2{margin:18px 0 3px}.avatar p{margin:0;color:#c8c4cf}.top{position:absolute;z-index:5;top:0;left:0;right:0;padding:18px 15px;display:flex;justify-content:space-between;background:linear-gradient(#000b,transparent)}.name{font-size:19px;font-weight:700}.online{font-size:12px;color:#a6f2c0}.actions{display:flex;gap:8px}button{border:0;color:#fff}.round{width:42px;height:42px;border-radius:50%;background:#15151bcc;font-size:19px}.self{position:absolute;z-index:6;right:14px;top:80px;width:105px;height:145px;border-radius:15px;overflow:hidden;background:#25242b;border:1px solid #ffffff55}.self video{width:100%;height:100%;object-fit:cover;transform:scaleX(-1)}.self span{position:absolute;bottom:7px;left:7px;background:#0009;padding:3px 7px;border-radius:8px;font-size:11px}.status{position:absolute;z-index:5;left:0;right:0;bottom:122px;text-align:center;font-size:13px;text-shadow:0 1px 6px #000}.chat{position:absolute;z-index:5;left:13px;right:13px;bottom:170px;max-height:30vh;overflow:hidden}.b{display:table;max-width:80%;padding:8px 11px;margin:5px 0;border-radius:15px;background:#000a;font-size:13px;line-height:1.35}.b.me{margin-left:auto;background:#7040b5}.controls{position:absolute;z-index:7;left:0;right:0;bottom:0;padding:20px 15px calc(18px + env(safe-area-inset-bottom));display:flex;justify-content:center;gap:11px;background:linear-gradient(transparent,#000d)}.control{width:55px;height:55px;border-radius:50%;background:#292932e8;font-size:22px}.end{width:64px;height:64px;background:#ed3442}.toast{position:absolute;z-index:10;top:50%;left:50%;transform:translate(-50%,-50%);background:#000d;padding:12px 18px;border-radius:20px;display:none;font-size:13px}.speaking{animation:pulse .8s infinite alternate}@keyframes pulse{from{box-shadow:0 0 0 0 #7040b566}to{box-shadow:0 0 0 17px #7040b500}}</style></head><body><div class="call"><div class="avatar" id="avatar"><div><div class="face">A</div><h2>Aanya ❤️</h2><p>Voice video call</p></div></div><div class="top"><div><div class="name">Aanya ❤️</div><div class="online">● Online</div></div><div class="actions"><button class="round" id="switch">↻</button><button class="round" id="more">⋮</button></div></div><div class="self"><video id="local" autoplay muted playsinline></video><span>You</span></div><div class="status" id="status">🎙️ Voice button dabakar Aanya se baat karo</div><div class="chat" id="chat"><div class="b">Hii 👋 Main Aanya hoon. Bolo na ❤️</div></div><div class="toast" id="toast"></div><div class="controls"><button class="control" id="cam">📷</button><button class="control" id="mic">🎙️</button><button class="control end" id="end">☎</button><button class="control" id="talk">🗣️</button><button class="control" id="speaker">🔊</button></div></div><script>const API='https://aanya-backend-2.onrender.com/chat';const local=document.getElementById('local'),avatar=document.getElementById('avatar'),statusEl=document.getElementById('status'),chat=document.getElementById('chat'),toast=document.getElementById('toast'),talk=document.getElementById('talk');let stream=null,facing='user',micOn=true,camOn=true,listening=false,recognition=null;function toastMsg(t){toast.textContent=t;toast.style.display='block';clearTimeout(toastMsg.t);toastMsg.t=setTimeout(()=>toast.style.display='none',1800)}function bubble(t,me=false){let x=document.createElement('div');x.className='b'+(me?' me':'');x.textContent=t;chat.appendChild(x);while(chat.children.length>5)chat.removeChild(chat.firstChild)}function speak(t){if(!('speechSynthesis'in window))return;speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang='hi-IN';u.rate=.96;u.pitch=1.05;u.onstart=()=>{talk.classList.add('speaking');statusEl.textContent='Aanya bol rahi hai… 🔊'};u.onend=()=>{talk.classList.remove('speaking');statusEl.textContent='Aanya sun rahi hai 👂'};speechSynthesis.speak(u)}async function ask(t){bubble(t,true);statusEl.textContent='Aanya soch rahi hai…';try{let r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:t})});if(!r.ok)throw Error('HTTP '+r.status);let d=await r.json(),reply=d.reply||d.response||d.message||d.text;if(!reply)throw Error('No reply');bubble(reply);speak(reply)}catch(e){console.error(e);statusEl.textContent='Backend se reply nahi mila';toastMsg('Gemini/Render backend check karo')}}function initRecognition(){const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){toastMsg('Chrome me voice input try karo');return null}let r=new SR();r.lang='hi-IN';r.interimResults=false;r.continuous=false;r.onstart=()=>{listening=true;talk.textContent='⏺️';statusEl.textContent='Main sun rahi hoon… bolo 👂'};r.onresult=e=>{let t=e.results[0][0].transcript.trim();if(t)ask(t)};r.onerror=()=>{listening=false;talk.textContent='🗣️';toastMsg('Mic permission allow karo')};r.onend=()=>{listening=false;talk.textContent='🗣️'};return r}async function startCamera(){try{if(stream)stream.getTracks().forEach(t=>t.stop());stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:facing,width:{ideal:1280},height:{ideal:720}},audio:true});local.srcObject=stream;avatar.style.display='none';statusEl.textContent='Camera connected • Aanya sun rahi hai 👂'}catch(e){toastMsg('Camera aur mic permission allow karo')}}document.getElementById('cam').onclick=async()=>{if(!stream)return startCamera();camOn=!camOn;stream.getVideoTracks().forEach(t=>t.enabled=camOn);document.getElementById('cam').textContent=camOn?'📷':'🚫'};document.getElementById('mic').onclick=()=>{if(!stream)return;micOn=!micOn;stream.getAudioTracks().forEach(t=>t.enabled=micOn);document.getElementById('mic').textContent=micOn?'🎙️':'🔇'};document.getElementById('switch').onclick=async()=>{facing=facing==='user'?'environment':'user';await startCamera()};talk.onclick=async()=>{if(!recognition)recognition=initRecognition();if(!recognition)return;if(listening)recognition.stop();else{if(!stream)await startCamera();try{recognition.start()}catch(e){}}};document.getElementById('speaker').onclick=()=>{if(speechSynthesis.speaking){speechSynthesis.cancel();talk.classList.remove('speaking');statusEl.textContent='Aanya ki voice pause'}else toastMsg('Speaker on')};document.getElementById('more').onclick=()=>toastMsg('🗣️ dabao aur Aanya se bolo');document.getElementById('end').onclick=()=>{recognition?.stop();speechSynthesis.cancel();if(stream)stream.getTracks().forEach(t=>t.stop());stream=null;local.srcObject=null;avatar.style.display='grid';statusEl.textContent='Call ended';toastMsg('Call ended')};</script></body></html>
